name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jammer
            path: .
          - name: ble-scanner
            path: tools/ble-scanner
          - name: rf-interference-detector
            path: tools/rf-interference-detector
    steps:
      - name: Checkout (RF24 submodule included)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Builds in the official ESP-IDF docker image. IDF_TARGET selects the
      # chip, so no interactive "set-target" prompt is needed.
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1.2.0
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: ${{ matrix.path }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: ${{ matrix.path }}/build/*.bin
          if-no-files-found: ignore
